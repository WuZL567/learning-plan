<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 问答 Demo · 整合练习二</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: #f5f6f8;
      color: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .app {
      max-width: 760px;
      height: 100vh;
      margin: 0 auto;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 14px 20px;
      border-bottom: 1px solid #eceef1;
    }

    .header h1 { margin: 0; font-size: 16px; }
    .header .sub { margin: 4px 0 0; font-size: 12px; color: #8b949e; }

    /* 消息列表：app.js 往这里插气泡 */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 一个气泡。user / ai / error 三种 class 交给 app.js 决定 */
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #1f6feb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      align-self: flex-start;
      background: #f0f2f5;
      border-bottom-left-radius: 4px;
    }

    .msg.error {
      align-self: flex-start;
      background: #fff1f0;
      color: #cf222e;
      border: 1px solid #ffccc7;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid #eceef1;
    }

    #input {
      flex: 1;
      resize: none;
      padding: 10px 12px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    #input:focus { border-color: #1f6feb; }

    #send {
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: #1f6feb;
      color: #fff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    #send:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>AI 问答 Demo</h1>
      <p class="sub">FastAPI + DeepSeek + SSE 流式输出</p>
    </header>

    <!-- 消息气泡由 app.js 动态插入 -->
    <main id="messages" class="messages"></main>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送 / Shift+Enter 换行）"></textarea>
      <button id="send">发送</button>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
