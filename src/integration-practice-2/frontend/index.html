<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 问答 Demo · 整合练习二</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      height: 100vh;
      background: #f5f6f8;
      color: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .app {
      max-width: 760px;
      height: 100vh;
      margin: 0 auto;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 14px 20px;
      border-bottom: 1px solid #eceef1;
    }

    .header h1 { margin: 0; font-size: 16px; }
    .header .sub { margin: 4px 0 0; font-size: 12px; color: #8b949e; }

    /* ---------------- 消息列表 ---------------- */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 气泡基类。user / ai / error / info 四种形态由 app.js 决定 */
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;      /* 保留用户输入里的换行 */
    }

    .msg.user {
      align-self: flex-end;
      background: #1f6feb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      align-self: flex-start;
      background: #f0f2f5;
      border-bottom-left-radius: 4px;
      /* AI 气泡里是 Markdown 渲染出来的 HTML，块级元素的间距交给下面的规则管，
         所以这里不能用 pre-wrap，否则段落之间会多出空白行 */
      white-space: normal;
    }

    .msg.error {
      align-self: flex-start;
      background: #fff1f0;
      color: #cf222e;
      border: 1px solid #ffccc7;
    }

    /* 「已停止生成」这类中性状态提示 */
    .msg.info {
      align-self: flex-start;
      background: #f6f8fa;
      color: #57606a;
      border: 1px dashed #d0d7de;
      font-size: 13px;
    }

    /* ---------------- AI 气泡里的 Markdown 样式 ---------------- */

    .msg.ai p { margin: 0 0 8px; }
    .msg.ai p:last-child { margin-bottom: 0; }

    .msg.ai ul, .msg.ai ol { margin: 0 0 8px; padding-left: 22px; }
    .msg.ai li { margin: 2px 0; }

    .msg.ai h1, .msg.ai h2, .msg.ai h3 {
      margin: 12px 0 6px;
      font-size: 15px;
      line-height: 1.4;
    }
    .msg.ai h1:first-child, .msg.ai h2:first-child, .msg.ai h3:first-child { margin-top: 0; }

    .msg.ai code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }

    /* 行内代码 */
    .msg.ai :not(pre) > code {
      background: #e2e6ea;
      padding: 1px 5px;
      border-radius: 4px;
    }

    /* 代码块 */
    .msg.ai pre {
      margin: 0 0 8px;
      padding: 12px 14px;
      background: #0d1117;
      color: #e6edf3;
      border-radius: 8px;
      overflow-x: auto;
      line-height: 1.5;
    }
    .msg.ai pre code { background: none; padding: 0; }

    .msg.ai blockquote {
      margin: 0 0 8px;
      padding: 2px 0 2px 10px;
      border-left: 3px solid #d0d7de;
      color: #57606a;
    }

    .msg.ai table { border-collapse: collapse; margin: 0 0 8px; font-size: 13px; }
    .msg.ai th, .msg.ai td { border: 1px solid #d0d7de; padding: 4px 8px; text-align: left; }
    .msg.ai th { background: #e7ebef; }

    .msg.ai a { color: #1f6feb; }

    /* ---------------- 输入区 ---------------- */

    .composer {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid #eceef1;
    }

    #input {
      flex: 1;
      resize: none;
      padding: 10px 12px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      outline: none;
      max-height: 140px;
    }

    #input:focus { border-color: #1f6feb; }

    #send, #stop {
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #send { background: #1f6feb; }
    #stop { background: #cf222e; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>AI 问答 Demo</h1>
      <p class="sub">FastAPI + DeepSeek + SSE 流式输出 · 支持多轮对话</p>
    </header>

    <!-- 消息气泡由 app.js 动态插入 -->
    <main id="messages" class="messages"></main>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送 / Shift+Enter 换行）"></textarea>
      <!-- 发送和停止占同一个位置，由 app.js 的 setGenerating() 切换显示 -->
      <button id="send">发送</button>
      <button id="stop" hidden>停止</button>
    </footer>
  </div>

  <!--
    本地 vendor 而不是 CDN：
    面试演示时可能没网 / 网络不稳，依赖 CDN 的 demo 会在关键时刻白屏。
    版本也写死在这里，不会因为 CDN 发了新版本行为突变。

    marked    —— Markdown → HTML
    DOMPurify —— 消毒。AI 的输出是外部输入，直接 innerHTML 会有 XSS 面
  -->
  <script src="./vendor/marked.min.js"></script>
  <script src="./vendor/purify.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
